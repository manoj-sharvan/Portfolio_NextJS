<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4400" />
      <stop offset="50%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#58E6D9" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1b1b" />
      <stop offset="100%" stop-color="#0d0d0d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#FF4400" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" stroke="url(#brandGrad)" stroke-width="16" />

  <!-- Code bracket accent left -->
  <path d="M125 200 L85 256 L125 312" fill="none" stroke="#58E6D9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  
  <!-- Code bracket accent right -->
  <path d="M387 200 L427 256 L387 312" fill="none" stroke="#FF4400" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Monogram text -->
  <text x="256" y="312" 
        font-family="system-ui, -apple-system, 'Montserrat', sans-serif" 
        font-size="185" 
        font-weight="900" 
        text-anchor="middle" 
        fill="#f5f5f5" 
        letter-spacing="-6"
        filter="url(#glow)">
    M<tspan fill="url(#brandGrad)">S</tspan>
  </text>
</svg>
